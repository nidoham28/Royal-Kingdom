name: Build Ren'Py Game

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENPY_VERSION: "8.4.1"

jobs:
  build:
    name: Build Ren'Py
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Ren'Py SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}

      - name: Download Ren'Py SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" -o sdk.tar.bz2
          mkdir -p ~/renpy-sdk
          tar -xjf sdk.tar.bz2 -C ~/renpy-sdk --strip-components=1

      - name: Build distributions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ~/renpy-sdk/renpy.sh launcher distribute "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/builds"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: renpy-build-${{ github.sha }}
          path: builds/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
