name: Build Ren'Py Game

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Cancel outdated runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token
permissions:
  contents: read

env:
  RENPY_VERSION: "8.4.1"

jobs:
  build:
    name: Build Ren'Py
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build Ren'Py project
        uses: ProjectAliceDev/renpy-build-action@v1
        with:
          project-dir: .
          renpy-version: ${{ env.RENPY_VERSION }}
          build-dir: builds

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: renpy-build-${{ github.sha }}
          path: builds/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0  # game archives are already compressed
