name: Build Ren'Py Android

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENPY_VERSION: "8.4.1"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ren'Py SDK (with Android tools)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-sdk-android-v2-${{ env.RENPY_VERSION }}

      - name: Download Ren'Py SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" -o sdk.tar.bz2
          mkdir -p ~/renpy-sdk
          tar -xjf sdk.tar.bz2 -C ~/renpy-sdk --strip-components=1

      - name: Download RAPT and install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-rapt.zip" -o rapt.zip
          unzip -q rapt.zip -d rapt-tmp
          # zip may contain a top-level "rapt" folder or the files directly
          if [ -d rapt-tmp/rapt ]; then mv rapt-tmp/rapt ~/renpy-sdk/rapt; else mv rapt-tmp ~/renpy-sdk/rapt; fi
          cd ~/renpy-sdk/rapt
          ls
          test -f android.py
          yes | python3 android.py installsdk

      - name: Configure Android project
        run: |
          cd "$HOME/renpy-sdk/rapt"
          python3 android.py configure "$GITHUB_WORKSPACE" || true

      - name: Build APK
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          "$HOME/renpy-sdk/renpy.sh" "$HOME/renpy-sdk/launcher" android_build "$GITHUB_WORKSPACE" assembleDebug

      - name: Collect build output
        run: |
          mkdir -p builds
          find "$HOME/renpy-sdk/rapt" "$GITHUB_WORKSPACE/.." -maxdepth 4 \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp -v {} builds/ \; 2>/dev/null || true
          ls -la builds/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: renpy-android-${{ github.sha }}
          path: builds/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
