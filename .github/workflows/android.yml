name: Build Ren'Py Android

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENPY_VERSION: "8.4.1"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ren'Py SDK (with Android tools)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-sdk-android-v4-${{ env.RENPY_VERSION }}

      - name: Download Ren'Py SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" -o sdk.tar.bz2
          mkdir -p ~/renpy-sdk
          tar -xjf sdk.tar.bz2 -C ~/renpy-sdk --strip-components=1

      - name: Create RAPT helper
        run: |
          cat > "$HOME/rapt.sh" << 'SCRIPT'
          #!/usr/bin/env bash
          # Runs rapt/android.py with Ren'Py's bundled Python and the renpy package on sys.path
          set -e
          SDK="$HOME/renpy-sdk"
          PY=$(find "$SDK/lib" -maxdepth 2 -type f \( -name python -o -name python3 \) -path "*py3-linux-x86_64*" | head -n1)
          cd "$SDK/rapt"
          exec "$PY" -c "
          import sys, runpy
          sys.path.insert(0, '$SDK')
          sys.argv = ['android.py'] + sys.argv[1:]
          runpy.run_path('android.py', run_name='__main__')
          " "$@"
          SCRIPT
          chmod +x "$HOME/rapt.sh"

      - name: Download RAPT and install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-rapt.zip" -o rapt.zip
          unzip -q rapt.zip -d rapt-tmp
          # zip may contain a top-level "rapt" folder or the files directly
          if [ -d rapt-tmp/rapt ]; then mv rapt-tmp/rapt ~/renpy-sdk/rapt; else mv rapt-tmp ~/renpy-sdk/rapt; fi
          cd ~/renpy-sdk/rapt
          ls
          test -f android.py
          yes | "$HOME/rapt.sh" installsdk

      - name: Configure Android project
        run: |
          yes "" | "$HOME/rapt.sh" configure "$GITHUB_WORKSPACE" || true

      - name: Generate throwaway signing keys (if repo has none)
        run: |
          for ks in android bundle; do
            if [ ! -f "$ks.keystore" ]; then
              keytool -genkey -keystore "$ks.keystore" -alias "$ks" -keyalg RSA -keysize 2048 \
                -keypass android -storepass android -validity 20000 \
                -dname "CN=Royal Kingdom, O=Dev, C=US"
            fi
          done

      - name: Build APK
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p builds
          "$HOME/renpy-sdk/renpy.sh" "$HOME/renpy-sdk/launcher" android_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/builds"

      - name: Collect build output
        run: |
          mkdir -p builds
          if ! ls builds/*.apk builds/*.aab >/dev/null 2>&1; then
            find "$HOME/renpy-sdk/rapt" "$GITHUB_WORKSPACE/.." -maxdepth 5 \
              \( -name "*.apk" -o -name "*.aab" \) -not -path "*/builds/*" \
              -exec cp -v {} builds/ \; 2>/dev/null || true
          fi
          ls -la builds/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: renpy-android-${{ github.sha }}
          path: builds/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0